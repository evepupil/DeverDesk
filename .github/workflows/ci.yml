# 每次推送到 main 和每个 Pull Request：类型检查、代码检查、单元测试，再把在线版和本地版各打包一次
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 最低支持的 22 和当前的 24：金额格式化等依赖运行时自带的国际化数据，不同版本输出可能不同
        node: [22, 24]
    env:
      # 计算层按本地日历日算日期，测试固定在一个时区
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本读 package.json 里的 packageManager
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:local
